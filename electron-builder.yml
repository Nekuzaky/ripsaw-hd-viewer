appId: com.nekuzaky.ripview
productName: RipView
copyright: Copyright © 2026 Nekuzaky
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - build/icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: RipView
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
publish:
  provider: github
  owner: Nekuzaky
  repo: ripsaw-hd-viewer
  releaseType: release
